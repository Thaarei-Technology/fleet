name: Bug report
description: Report reproducible product behavior without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities or include secrets/customer data here. Use the private Security Advisory channel described in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized reproduction steps and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
    validations:
      required: true
